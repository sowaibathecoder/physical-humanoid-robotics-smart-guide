name: Link Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-links:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build site
      run: npm run build

    - name: Validate links
      run: |
        # Install linkinator if not already in package.json
        if ! npm list --depth=0 linkinator > /dev/null 2>&1; then
          npm install -g linkinator
        fi

        # Run link validation on built site
        npx linkinator build/ --recurse --skip "^(?!http)" --verbosity error