name: Markdown Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run markdown lint
      run: |
        # Check if markdownlint-cli is available in package.json
        if npm list --depth=0 markdownlint-cli > /dev/null 2>&1; then
          npx markdownlint-cli "**/*.md" --ignore node_modules
        else
          echo "markdownlint-cli not found in package.json, installing temporarily"
          npx markdownlint-cli "**/*.md" --ignore node_modules
        fi