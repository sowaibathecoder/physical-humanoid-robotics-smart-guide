<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" fill="#000000"/>

  <!-- Simplified Robot Icon -->
  <circle cx="16" cy="10" r="4" fill="none" stroke="url(#neonGradient)" stroke-width="1.5"/>

  <!-- Robot Body -->
  <rect x="12" y="14" width="8" height="10" rx="1" fill="none" stroke="url(#neonGradient)" stroke-width="1.5"/>

  <!-- Robot Arms -->
  <line x1="12" y1="16" x2="8" y2="18" stroke="url(#neonGradient)" stroke-width="1.5"/>
  <line x1="20" y1="16" x2="24" y2="18" stroke="url(#neonGradient)" stroke-width="1.5"/>

  <!-- Robot Legs -->
  <line x1="14" y1="24" x2="14" y2="28" stroke="url(#neonGradient)" stroke-width="1.5"/>
  <line x1="18" y1="24" x2="18" y2="28" stroke="url(#neonGradient)" stroke-width="1.5"/>

  <!-- AI Circuit Element -->
  <circle cx="16" cy="10" r="2" fill="url(#neonGradient)"/>